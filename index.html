const base = location.hostname.endsWith("enjoy-onepage.com") ? "enjoy-onepage.com" : "enjoy-onepage.com";
function url(slug){ return "https://"+slug+"."+base; }

const catalog = document.getElementById("catalog");
let total = 0;
const prerendered = !!catalog.querySelector("section.cat"); // 허브 동기화가 넣은 정적 카드(검색 로봇용)가 있으면 다시 그리지 않음
CATS.forEach(cat=>{
  total += cat.items.length;
  if (prerendered) return;
  const sec = document.createElement("section");
  sec.className = "cat";
  sec.innerHTML = `<h2>${cat.icon} ${cat.name}</h2><p class="desc">${cat.desc}</p>`;
  const grid = document.createElement("div");
  grid.className = "grid";
  cat.items.forEach(it=>{
    const a = document.createElement("a");
    a.className = "card";
    a.href = url(it.s);
    a.rel = "noopener";
    a.innerHTML = `<div class="t">${it.t}</div><div class="d">${it.d}</div>`;
    a.dataset.search = (it.t+" "+it.d+" "+it.s).toLowerCase();
    grid.appendChild(a);
  });
  sec.appendChild(grid);
  catalog.appendChild(sec);
});
document.getElementById("stats").textContent = `${total}개+ 무료 웹앱 · 모두 브라우저에서 바로 실행`;
document.getElementById("yr").textContent = new Date().getFullYear();

// 실시간 검색 필터
const q = document.getElementById("q");
q.addEventListener("input", ()=>{
  const term = q.value.trim().toLowerCase();
  document.querySelectorAll(".cat").forEach(sec=>{
    let visible = 0;
    sec.querySelectorAll("a.card").forEach(card=>{
      const match = !term || card.dataset.search.includes(term);
      card.classList.toggle("hidden", !match);
      if(match) visible++;
    });
    sec.classList.toggle("hidden", visible===0);
  });
});
