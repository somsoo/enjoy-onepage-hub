function url(slug){ return "https://"+slug+"."+base; }

const catalog = document.getElementById("catalog");
let total = 0;
CATS.forEach(cat=>{
  total += cat.items.length;
  const sec = document.createElement("section");
  sec.className = "cat";
  sec.innerHTML = `<h2>${cat.icon} ${cat.name}</h2><p class="desc">${cat.desc}</p>`;

  grid.className = "grid";

    a.href = url(it.s);
    a.rel = "noopener";
    a.innerHTML = `<div class="t">${it.t}</div><div class="d">${it.d}</div>`;

    grid.appendChild(a);
  });
  sec.appendChild(grid);
  catalog.appendChild(sec);
});

const q = document.getElementById("q");
q.addEventListener("input", ()=>{
  const term = q.value.trim().toLowerCase();
  document.querySelectorAll(".cat").forEach(sec=>{
    let visible = 0;
    sec.querySelectorAll("a.card").forEach(card=>{
      const match = !term || card.dataset.search.includes(term);
      card.classList.toggle("hidden", !match);
      if(match) visible++;
    });
    sec.classList.toggle("hidden", visible===0);
  });
});
